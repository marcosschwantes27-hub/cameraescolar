[project]
name = "registro-escolar-api"
version = "0.1.0"
description = "API do Sistema de Atendimento e Ocorrências Escolares"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "numpy==2.2.6",
  "opencv-python-headless==4.14.0.94",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "pyjwt==2.13.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
